<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 496" width="1400" height="496" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="virtual-patch-copilot — find, route, mitigate, cure"><title>virtual-patch-copilot — find, route, mitigate, cure</title><desc>Four acts: eight agents find and refute vulnerabilities, route each to the strongest control, apply a proven band-aid on F5 Distributed Cloud, F5 WAF for NGINX or BIG-IP Advanced WAF, and ship the code fix that retires it.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0.8 L9 5 L0 9.2 z" fill="#6a7282"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0.8 L9 5 L0 9.2 z" fill="#e4002b"/></marker><marker id="ar-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0.8 L9 5 L0 9.2 z" fill="#17181c"/></marker><marker id="ar-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0.8 L9 5 L0 9.2 z" fill="#009639"/></marker><marker id="ar-white" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0.8 L9 5 L0 9.2 z" fill="#ffffff"/></marker><marker id="ar-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0.8 L9 5 L0 9.2 z" fill="#9aa1ad"/></marker><marker id="ar-xc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0.8 L9 5 L0 9.2 z" fill="#0e41aa"/></marker></defs><rect x="0" y="0" width="1400" height="496" rx="0" fill="#ffffff" /><g transform="translate(40,22) scale(1.1666666666666667)"><path d="M12 1.9 4 4.9v6.3c0 5.1 3.3 9 8 10.5 4.7-1.5 8-5.4 8-10.5V4.9L12 1.9Z" fill="none" stroke="#17181c" stroke-width="1.6" stroke-linejoin="round"/><rect x="6.2" y="10.1" width="11.6" height="4.4" rx="2.2" transform="rotate(-38 12 12.3)" fill="#e4002b"/><circle cx="12" cy="12.3" r="1.05" fill="#fff"/></g><text x="79" y="44" font-size="19" font-weight="800" fill="#17181c">virtual-patch<tspan fill="#e4002b">·</tspan>copilot</text><text x="1360" y="44" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6a7282" font-weight="400" text-anchor="end">the exposure window, from weeks to minutes</text><line x1="40" y1="66" x2="1360" y2="66" stroke="#dcdade" stroke-width="1" stroke-linecap="round"/><rect x="40" y="94" width="300" height="250" rx="14" fill="#ffffff" stroke="#dcdade" stroke-width="1" /><rect x="40" y="94" width="300" height="4" rx="2" fill="#009639" /><circle cx="74" cy="134" r="16" fill="#009639"/><text x="74" y="140" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#fff" font-weight="800" text-anchor="middle">1</text><text x="100" y="139" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#009639" font-weight="700" text-anchor="start" letter-spacing="1.4">FIND</text><text x="62" y="182" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17.5" fill="#17181c" font-weight="800" text-anchor="start">Find what is really</text><text x="62" y="204" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17.5" fill="#17181c" font-weight="800" text-anchor="start">there</text><text x="62" y="232" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6a7282" font-weight="400" text-anchor="start">Eight agents read your repo, a CVE, the</text><text x="62" y="249" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6a7282" font-weight="400" text-anchor="start">dependency manifests or an OpenAPI spec</text><text x="62" y="266" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6a7282" font-weight="400" text-anchor="start">— then adversarially refute the findings</text><text x="62" y="283" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6a7282" font-weight="400" text-anchor="start">that do not hold up.</text><rect x="62" y="306" width="53.800000000000004" height="22" rx="11" fill="#f6f6f8" stroke="#dcdade" stroke-width="1" /><text x="88.9" y="321" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#17181c" font-weight="700" text-anchor="middle">resolve</text><rect x="122.80000000000001" y="306" width="60.2" height="22" rx="11" fill="#f6f6f8" stroke="#dcdade" stroke-width="1" /><text x="152.9" y="321" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#17181c" font-weight="700" text-anchor="middle">discover</text><rect x="190.0" y="306" width="47.400000000000006" height="22" rx="11" fill="#f6f6f8" stroke="#dcdade" stroke-width="1" /><text x="213.7" y="321" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#17181c" font-weight="700" text-anchor="middle">verify</text><rect x="380" y="94" width="300" height="250" rx="14" fill="#ffffff" stroke="#dcdade" stroke-width="1" /><rect x="380" y="94" width="300" height="4" rx="2" fill="#0e41aa" /><circle cx="414" cy="134" r="16" fill="#0e41aa"/><text x="414" y="140" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#fff" font-weight="800" text-anchor="middle">2</text><text x="440" y="139" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#0e41aa" font-weight="700" text-anchor="start" letter-spacing="1.4">ROUTE</text><text x="402" y="182" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17.5" fill="#17181c" font-weight="800" text-anchor="start">Pick the control that</text><text x="402" y="204" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17.5" fill="#17181c" font-weight="800" text-anchor="start">stops it</text><text x="402" y="232" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6a7282" font-weight="400" text-anchor="start">Every surviving finding is routed to the</text><text x="402" y="249" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6a7282" font-weight="400" text-anchor="start">strongest available control, or honestly</text><text x="402" y="266" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6a7282" font-weight="400" text-anchor="start">to code when no band-aid can hold the</text><text x="402" y="283" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6a7282" font-weight="400" text-anchor="start">line.</text><rect x="402" y="306" width="47.400000000000006" height="22" rx="11" fill="#f6f6f8" stroke="#dcdade" stroke-width="1" /><text x="425.7" y="321" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#17181c" font-weight="700" text-anchor="middle">triage</text><path d="M348 219 L371 219" fill="none" stroke="#6a7282" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="720" y="94" width="300" height="250" rx="14" fill="#ffffff" stroke="#dcdade" stroke-width="1" /><rect x="720" y="94" width="300" height="4" rx="2" fill="#e4002b" /><circle cx="754" cy="134" r="16" fill="#e4002b"/><text x="754" y="140" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#fff" font-weight="800" text-anchor="middle">3</text><text x="780" y="139" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#e4002b" font-weight="700" text-anchor="start" letter-spacing="1.4">MITIGATE</text><text x="742" y="182" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17.5" fill="#17181c" font-weight="800" text-anchor="start">Patch it on the proxy</text><text x="742" y="204" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17.5" fill="#17181c" font-weight="800" text-anchor="start">you run</text><text x="742" y="232" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6a7282" font-weight="400" text-anchor="start">One declarative band-aid for every F5</text><text x="742" y="249" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6a7282" font-weight="400" text-anchor="start">enforcement point, applied behind a</text><text x="742" y="266" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6a7282" font-weight="400" text-anchor="start">human gate and fired at with the real</text><text x="742" y="283" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6a7282" font-weight="400" text-anchor="start">exploit. If it does not block, it does</text><text x="742" y="300" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6a7282" font-weight="400" text-anchor="start">not ship.</text><rect x="742" y="306" width="60.2" height="22" rx="11" fill="#f6f6f8" stroke="#dcdade" stroke-width="1" /><text x="772.1" y="321" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#17181c" font-weight="700" text-anchor="middle">generate</text><rect x="809.2" y="306" width="41.0" height="22" rx="11" fill="#f6f6f8" stroke="#dcdade" stroke-width="1" /><text x="829.7" y="321" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#17181c" font-weight="700" text-anchor="middle">probe</text><rect x="857.2" y="306" width="47.400000000000006" height="22" rx="11" fill="#f6f6f8" stroke="#dcdade" stroke-width="1" /><text x="880.9000000000001" y="321" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#17181c" font-weight="700" text-anchor="middle">refine</text><path d="M688 219 L711 219" fill="none" stroke="#6a7282" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="1060" y="94" width="300" height="250" rx="14" fill="#ffffff" stroke="#dcdade" stroke-width="1" /><rect x="1060" y="94" width="300" height="4" rx="2" fill="#61228b" /><circle cx="1094" cy="134" r="16" fill="#61228b"/><text x="1094" y="140" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#fff" font-weight="800" text-anchor="middle">4</text><text x="1120" y="139" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#61228b" font-weight="700" text-anchor="start" letter-spacing="1.4">CURE</text><text x="1082" y="182" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17.5" fill="#17181c" font-weight="800" text-anchor="start">Ship the fix, drop the</text><text x="1082" y="204" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17.5" fill="#17181c" font-weight="800" text-anchor="start">patch</text><text x="1082" y="232" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6a7282" font-weight="400" text-anchor="start">A code-fix pull request for every</text><text x="1082" y="249" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6a7282" font-weight="400" text-anchor="start">finding, and a ledger that retires the</text><text x="1082" y="266" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6a7282" font-weight="400" text-anchor="start">band-aid once the cure actually lands.</text><rect x="1082" y="306" width="66.6" height="22" rx="11" fill="#f6f6f8" stroke="#dcdade" stroke-width="1" /><text x="1115.3" y="321" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#17181c" font-weight="700" text-anchor="middle">remediate</text><path d="M1028 219 L1051 219" fill="none" stroke="#6a7282" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/><path d="M870 348 L870 386" fill="none" stroke="#e4002b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#ar-red)"/><rect x="40" y="390" width="1320" height="76" rx="14" fill="#111317" /><text x="64" y="418" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#ffffff" font-weight="700" text-anchor="start" letter-spacing="1.4">ONE BAND-AID, ENFORCED ON THE F5 PROXY YOU ALREADY RUN</text><text x="64" y="440" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#8d95a3" font-weight="400" text-anchor="start">in priority order — the same finding, whichever box fronts your app</text><rect x="604" y="404" width="240" height="48" rx="10" fill="#22242a" stroke="#3a3d47" stroke-width="1" /><rect x="604" y="404" width="4" height="48" rx="2" fill="#0e41aa" /><text x="620" y="423" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" font-weight="800" text-anchor="start">1 · F5 Distributed Cloud</text><text x="620" y="438" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" fill="#8d95a3" font-weight="400" text-anchor="start">all 7 controls</text><rect x="856" y="404" width="240" height="48" rx="10" fill="#22242a" stroke="#3a3d47" stroke-width="1" /><rect x="856" y="404" width="4" height="48" rx="2" fill="#00843d" /><text x="872" y="423" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" font-weight="800" text-anchor="start">2 · F5 WAF for NGINX</text><text x="872" y="438" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" fill="#8d95a3" font-weight="400" text-anchor="start">3 forms · live-proven</text><rect x="1108" y="404" width="240" height="48" rx="10" fill="#22242a" stroke="#3a3d47" stroke-width="1" /><rect x="1108" y="404" width="4" height="48" rx="2" fill="#61228b" /><text x="1124" y="423" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" font-weight="800" text-anchor="start">3 · BIG-IP Advanced WAF</text><text x="1124" y="438" font-family="Aptos,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" fill="#8d95a3" font-weight="400" text-anchor="start">3 forms · live-proven</text